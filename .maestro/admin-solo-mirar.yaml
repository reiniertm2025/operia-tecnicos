# SOLO MIRAR, con la sesión del administrador («reinier») ya abierta: menú → Administración → Dashboard (cambia de periodo)
# y Órdenes de trabajo → Por autorizar. No cambia ningún dato. Correr:
# maestro test .maestro/admin-solo-mirar.yaml --test-output-dir build/maestro (y borrar las capturas al revisarlas).
appId: com.operia.operia_tecnicos
---
- launchApp
- assertNotVisible: "Entrar|Sign in"
- extendedWaitUntil:
    visible: "(?s).*(Pendientes|Pending)\\n.*"
    timeout: 20000

- tapOn: "Abrir el menú de navegación|Open navigation menu"
- assertVisible: "ADMINISTRACIÓN|ADMINISTRATION"
- tapOn: "Dashboard"
- extendedWaitUntil:
    visible: "Ingresos cobrados|Collected income"
    timeout: 20000
- takeScreenshot: a1-dashboard-mes
- scroll
- takeScreenshot: a2-dashboard-abajo
- scrollUntilVisible:
    element: "Por t.cnico|By technician"
    timeout: 20000
    visibilityPercentage: 50
- takeScreenshot: a3-dashboard-tecnicos
- back

- tapOn: "Abrir el menú de navegación|Open navigation menu"
- tapOn: "Órdenes de trabajo|Work orders"
- tapOn: "Por autorizar|To authorize"
- extendedWaitUntil:
    visible: "(?s).*(Finanzas|Finance).*"
    timeout: 20000
- takeScreenshot: a4-por-autorizar
- back
